name: UntilPayday
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  UntilPaydayCore:
    path: CorePackage
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0

targets:
  UntilPayday:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppSources/UntilPayday
      - path: AppSources/Shared
    info:
      path: Config/AppInfo.plist
    entitlements:
      path: Config/UntilPayday.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baewumnote.untilpayday
        PRODUCT_NAME: UntilPayday
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: UntilPaydayCore
        product: UntilPaydayCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - target: UntilPaydayWidget
        embed: true

  UntilPaydayWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppSources/UntilPaydayWidget
      - path: AppSources/Shared
    info:
      path: Config/WidgetInfo.plist
    entitlements:
      path: Config/UntilPaydayWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baewumnote.untilpayday.widget
        PRODUCT_NAME: UntilPaydayWidget
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"

  UntilPaydayTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests/UntilPaydayTests
    dependencies:
      - target: UntilPayday

  UntilPaydayUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests/UntilPaydayUITests
    dependencies:
      - target: UntilPayday
