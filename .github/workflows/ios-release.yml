name: App Store signed delivery
run-name: Payday Left signed build ${{ inputs.build_number }} (${{ inputs.ad_mode }})

'on':
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Successful ios-build run for this exact main commit
        required: true
        type: string
      build_number:
        description: Unique positive App Store build number
        required: true
        default: '2'
        type: string
      ad_mode:
        description: TestFlight test ads or verified production ads (store review uses production)
        required: true
        default: production
        type: choice
        options:
          - production
          - test

permissions:
  contents: read
  actions: read

concurrency:
  group: untilpayday-app-store
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ inputs.build_number }}
  VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
  AD_MODE: ${{ inputs.ad_mode }}
  UNTILPAYDAY_ASC_APP_ID: ${{ vars.UNTILPAYDAY_ASC_APP_ID }}
  UNTILPAYDAY_ASC_KEY_ID: ${{ vars.UNTILPAYDAY_ASC_KEY_ID }}
  UNTILPAYDAY_ASC_ISSUER_ID: ${{ vars.UNTILPAYDAY_ASC_ISSUER_ID }}
  UNTILPAYDAY_ADMOB_APP_ID: ${{ vars.UNTILPAYDAY_ADMOB_APP_ID }}
  UNTILPAYDAY_ADMOB_INTERSTITIAL_ID: ${{ vars.UNTILPAYDAY_ADMOB_INTERSTITIAL_ID }}

jobs:
  signing-preflight:
    if: github.repository == 'baewumnote-studio/untilpayday-ios-public-build' && github.ref == 'refs/heads/main' && !github.event.repository.private && github.actor == 'baewumnote-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check source, deployment tests and successful native verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install -r Build/requirements.txt
          python3 Build/verify_source.py
          python3 -m unittest discover -s Build -p 'test_*.py'
          python3 Build/release_gate.py
      - name: Validate actual App Store profiles, existing P12, API access and private retention before Mac time
        env:
          UNTILPAYDAY_DISTRIBUTION_P12_BASE64: ${{ secrets.UNTILPAYDAY_DISTRIBUTION_P12_BASE64 }}
          UNTILPAYDAY_DISTRIBUTION_P12_PASSWORD: ${{ secrets.UNTILPAYDAY_DISTRIBUTION_P12_PASSWORD }}
          UNTILPAYDAY_STORE_APP_PROFILE_BASE64: ${{ secrets.UNTILPAYDAY_STORE_APP_PROFILE_BASE64 }}
          UNTILPAYDAY_STORE_WIDGET_PROFILE_BASE64: ${{ secrets.UNTILPAYDAY_STORE_WIDGET_PROFILE_BASE64 }}
          UNTILPAYDAY_ASC_KEY_BASE64: ${{ secrets.UNTILPAYDAY_ASC_KEY_BASE64 }}
          UNTILPAYDAY_PRIVATE_DELIVERY_TOKEN: ${{ secrets.UNTILPAYDAY_PRIVATE_DELIVERY_TOKEN }}
        run: |
          python3 Build/store_signing.py preflight
          python3 Build/store_upload.py check-app
          python3 Build/private_delivery.py check

  app-store:
    needs: signing-preflight
    runs-on: xcode-27
    timeout-minutes: 35
    environment: app-store
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Recheck SDK, successful exact-commit verification and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install -r Build/requirements.txt
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          python3 Build/release_gate.py
          python3 Build/verify_source.py
          python3 Scripts/verify_xcode_assembly.py
      - name: Prepare isolated release copy and approved existing signing identity
        env:
          UNTILPAYDAY_DISTRIBUTION_P12_BASE64: ${{ secrets.UNTILPAYDAY_DISTRIBUTION_P12_BASE64 }}
          UNTILPAYDAY_DISTRIBUTION_P12_PASSWORD: ${{ secrets.UNTILPAYDAY_DISTRIBUTION_P12_PASSWORD }}
          UNTILPAYDAY_STORE_APP_PROFILE_BASE64: ${{ secrets.UNTILPAYDAY_STORE_APP_PROFILE_BASE64 }}
          UNTILPAYDAY_STORE_WIDGET_PROFILE_BASE64: ${{ secrets.UNTILPAYDAY_STORE_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 Build/store_signing.py prepare
          SIGNING_KEYCHAIN="$RUNNER_TEMP/untilpayday-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/untilpayday-distribution.p12" -P "$UNTILPAYDAY_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
      - name: Archive main app and widget, export App Store IPA and verify actual signing
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/untilpayday-build"
          xcodebuild -resolvePackageDependencies -project UntilPayday.xcodeproj -scheme UntilPayday -clonedSourcePackagesDirPath "$RUNNER_TEMP/untilpayday-packages"
          xcodebuild -project UntilPayday.xcodeproj -scheme UntilPayday -configuration Release -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath "$RUNNER_TEMP/untilpayday-packages" -archivePath "$RUNNER_TEMP/UntilPayday.xcarchive" archive
          cd "$GITHUB_WORKSPACE"
          python3 Build/store_signing.py verify-archive --path "$RUNNER_TEMP/UntilPayday.xcarchive"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UntilPayday.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/untilpayday-export.plist" -exportPath "$RUNNER_TEMP/untilpayday-ipa"
          python3 Build/store_signing.py verify-ipa --path "$RUNNER_TEMP/untilpayday-ipa/UntilPayday.ipa"
          python3 - <<'PY'
          import os, pathlib, sys, tempfile, zipfile
          sys.path.insert(0, 'Build')
          import store_signing
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as folder:
              with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'untilpayday-ipa/UntilPayday.ipa') as archive:
                  archive.extractall(folder)
              apps = list((pathlib.Path(folder)/'Payload').glob('*.app'))
              if len(apps) != 1: raise SystemExit('Expected one exported app')
              store_signing.check_native(apps[0], store_signing.identity(), os.environ['BUILD_NUMBER'])
          PY
          tar -czf "$RUNNER_TEMP/UntilPayday.xcarchive.tar.gz" -C "$RUNNER_TEMP" UntilPayday.xcarchive
      - name: Preserve original archive and IPA privately before direct Apple upload
        env:
          UNTILPAYDAY_PRIVATE_DELIVERY_TOKEN: ${{ secrets.UNTILPAYDAY_PRIVATE_DELIVERY_TOKEN }}
        run: python3 Build/private_delivery.py preserve
      - name: Upload directly to App Store Connect; no review submission
        env:
          UNTILPAYDAY_ASC_KEY_BASE64: ${{ secrets.UNTILPAYDAY_ASC_KEY_BASE64 }}
        run: python3 Build/store_upload.py upload
      - name: Verify checkout remained unchanged
        run: python3 Build/verify_source.py
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/untilpayday-signing.keychain-db" 2>/dev/null || true
          python3 - <<'PY'
          import os, pathlib
          for name in ('untilpayday-distribution.p12', 'untilpayday-app.mobileprovision', 'untilpayday-widget.mobileprovision'):
              (pathlib.Path(os.environ['RUNNER_TEMP'])/name).unlink(missing_ok=True)
          PY
